[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "formation-damage-api"
version = "1.0.0"
description = "FastAPI service for computational analysis of filtration-induced formation damage in deviated wells"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
